include:
  - local: '/build/docker/_docker.yml'

.docker-build-base:
  image: ${DOCKER_BUILD_IMAGE_NAME}:${DOCKER_BUILD_IMAGE_TAG}
  variables:
    DOCKER_BUILD_IMAGE_NAME: pedroetb/docker-build
    DOCKER_BUILD_IMAGE_TAG: latest
    PACKAGED_IMAGE_NAME: ${CI_REGISTRY_IMAGE}
    REGISTRY_URL: ${CI_REGISTRY}
    REGISTRY_USER: gitlab-ci-token
    REGISTRY_PASS: ${CI_JOB_TOKEN}

.docker-build:
  extends:
    - .dind-env
    - .docker-build-base
  variables:
    CUSTOM_COMPOSE_FILENAME: compose.yaml
  before_script:
    - >
      if [ ${OMIT_EXISTING_IMAGE_CHECK} -eq 1 ];
      then
        echo "Existing image check is omitted, proceeding to build ..";
      else
        echo "Looking for existing '${PACKAGED_IMAGE_NAME}:${PACKAGED_IMAGE_TAG}' image at registry ..";
        echo "${REGISTRY_PASS}" | docker login -u "${REGISTRY_USER}" --password-stdin "${REGISTRY_URL}";
        imageCheckExitCode=0;
        docker manifest inspect "${PACKAGED_IMAGE_NAME}:${PACKAGED_IMAGE_TAG}" > /dev/null 2>&1 || imageCheckExitCode=${?};
        docker logout "${REGISTRY_URL}";
        if [ ${imageCheckExitCode} -eq 0 ];
        then
          echo "Image found at registry, omitting build!";
          echo "Tip: You can set 'OMIT_EXISTING_IMAGE_CHECK=1' to allow image rebuilding!";
          exit 0;
        else
          echo "Image not found at registry, proceeding to build ..";
        fi;
      fi;
    - >
      echo "Find Compose files with known names at known paths automatically ..";
      if [ -z "${COMPOSE_FILE_NAME}" ];
      then
        for directory in ${COMPOSE_PROJECT_DIRECTORY:-build docker .};
        do
          if [ ! -d "${directory}" ];
          then
            continue;
          fi;
          composeFilePath=$(find "./${directory}" -type f -name "${CUSTOM_COMPOSE_FILENAME}" -print -quit);
          if [ -f "${composeFilePath}" ];
          then
            echo "Detected '${composeFilePath}' compose file, nice!";
            composeFileName="${CUSTOM_COMPOSE_FILENAME}";
            composeProjectDirectory=$(dirname "${composeFilePath}");
          else
            echo "No compose file detected at '${directory}/'";
          fi;
          if [ ! -z "${composeFileName}" ];
          then
            echo "Automatically set COMPOSE_FILE_NAME to '${composeFileName}' and COMPOSE_PROJECT_DIRECTORY to '${composeProjectDirectory}'";
            export COMPOSE_FILE_NAME="${composeFileName}";
            export COMPOSE_PROJECT_DIRECTORY="${composeProjectDirectory}";
            break;
          fi;
        done;
        if [ -z "${COMPOSE_FILE_NAME}" ];
        then
          echo "No compose file specified or detected, using docker-build default for COMPOSE_FILE_NAME and COMPOSE_PROJECT_DIRECTORY";
        fi;
      else
        echo "COMPOSE_FILE_NAME is defined, omitting automatic lookup";
      fi;
  script: build

.docker-build-tag:
  extends:
    - .dind-env
    - .docker-build-base
  dependencies: []
  variables:
    SOURCE_IMAGE: ${PACKAGED_IMAGE_NAME}:${PACKAGED_IMAGE_TAG}
    TARGET_IMAGE_TAG: ${CI_COMMIT_TAG}
  script: tag

.docker-build-tag-gitlab:
  extends: .docker-build-tag
  variables:
    TARGET_IMAGE_NAME: ${CI_REGISTRY_IMAGE}
  before_script:
    export TARGET_IMAGE=${TARGET_IMAGE_NAME}:${TARGET_IMAGE_TAG}

.docker-build-tag-dockerhub:
  extends: .docker-build-tag
  variables:
    SOURCE_IMAGE_NAME: ${CI_PROJECT_PATH}
    ROOT_NAME: ${DOCKER_HUB_ROOT}
    TARGET_REGISTRY_URL: docker.io
    TARGET_REGISTRY_USER: ${DOCKER_HUB_USER}
    TARGET_REGISTRY_PASS: ${DOCKER_HUB_PASS}
  before_script:
    export TARGET_IMAGE=$(flatten):${TARGET_IMAGE_TAG}

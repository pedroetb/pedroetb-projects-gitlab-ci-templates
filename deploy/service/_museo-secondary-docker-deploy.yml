include:
  - local: '/deploy/service/_docker-deploy.yml'

.deploy-museo-secondary:
  variables:
    DEPLOY_ENVIRONMENT_NAME: museo-secondary
    SSH_REMOTE: ${MUSEO_SECONDARY_SSH_REMOTE}
    SSH_PORT: ${MUSEO_SECONDARY_SSH_PORT}
    DEPLOY_KEY: ${MUSEO_SECONDARY_DEPLOY_KEY}
    DD_TRAEFIK_DOMAIN: ${MUSEO_SECONDARY_TRAEFIK_DOMAIN}
    DD_VOL_ADDR: ${MUSEO_SECONDARY_VOL_ADDR}
    DD_VOL_DEVICE_PREFIX: ${MUSEO_SECONDARY_VOL_DEVICE_PREFIX}
